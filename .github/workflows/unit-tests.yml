name: Run Unit Tests

on: [push]

jobs:
  run-unit-tests:
    name: Run Unit Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-node@v3
        with:
          node-version: 18
          cache: 'npm'

      - run: npm ci

      - name: 🔧 Set Up Environment Variables
        run: |
          echo "JWT_SECRET=my_super_secret_key" >> $GITHUB_ENV

      - run: npm test
